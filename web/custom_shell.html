<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		:root {
			--bg-dark: #07090c;
			--panel-bg: #111419;
			--amber: #f5a623;
			--amber-dim: #7a5214;
			--green: #7ae852;
			--red: #ff472b;
			--text-main: #f5ecce;
			--text-muted: #9c9278;
		}
		* { box-sizing: border-box; }
		html, body, #canvas {
			margin: 0;
			padding: 0;
			border: 0;
			width: 100%;
			height: 100%;
			background: var(--bg-dark);
			color: var(--text-main);
			overflow: hidden;
			user-select: none;
			-webkit-user-select: none;
			touch-action: none;
			font-family: "Segoe UI", system-ui, -apple-system, Roboto, monospace;
		}
		#canvas {
			display: block;
		}
		#canvas:focus {
			outline: none;
		}
		#status {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			background:
				radial-gradient(circle at 50% 42%, rgba(245, 166, 35, 0.12), transparent 58%),
				repeating-linear-gradient(
					-45deg,
					rgba(255, 255, 255, 0.014) 0px,
					rgba(255, 255, 255, 0.014) 8px,
					transparent 8px,
					transparent 16px
				),
				var(--bg-dark);
			z-index: 10;
			transition: opacity 0.28s ease-out;
		}
		#status.fade-out {
			opacity: 0;
			pointer-events: none;
		}
		.loader-card {
			width: min(560px, 90vw);
			background: rgba(14, 16, 20, 0.94);
			border: 2px solid var(--amber-dim);
			box-shadow: 0 0 0 1px rgba(245, 166, 35, 0.16), 0 24px 64px rgba(0, 0, 0, 0.78);
			padding: 28px 30px 24px;
			position: relative;
		}
		.hazard-strip {
			height: 8px;
			margin: -28px -30px 22px;
			background: repeating-linear-gradient(
				-55deg,
				var(--amber) 0px,
				var(--amber) 12px,
				#15171b 12px,
				#15171b 24px
			);
			opacity: 0.85;
		}
		.kicker {
			font-size: 11px;
			letter-spacing: 0.26em;
			color: var(--amber);
			text-transform: uppercase;
			margin-bottom: 6px;
			font-weight: 700;
		}
		.title {
			font-size: clamp(26px, 4.4vw, 38px);
			font-weight: 900;
			letter-spacing: 0.1em;
			margin: 0 0 6px;
			color: var(--text-main);
			text-transform: uppercase;
		}
		.subtitle {
			font-size: 13px;
			letter-spacing: 0.06em;
			color: var(--text-muted);
			margin: 0 0 22px;
		}
		.rpm-header {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			font-size: 12px;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			margin-bottom: 8px;
		}
		#status-label {
			color: var(--text-main);
			font-weight: 700;
		}
		#status-pct {
			color: var(--green);
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-weight: 700;
		}
		.rpm-track {
			width: 100%;
			height: 16px;
			background: #090b0f;
			border: 1px solid var(--amber-dim);
			padding: 2px;
			overflow: hidden;
		}
		#rpm-fill {
			height: 100%;
			width: 4%;
			background: linear-gradient(90deg, var(--green) 0%, var(--amber) 72%, var(--red) 100%);
			transition: width 0.14s linear;
		}
		.controls-bar {
			margin-top: 20px;
			padding-top: 14px;
			border-top: 1px solid rgba(245, 166, 35, 0.22);
			display: flex;
			flex-wrap: wrap;
			gap: 8px 14px;
			font-size: 11px;
			color: var(--text-muted);
			letter-spacing: 0.05em;
		}
		.controls-bar span b {
			color: var(--amber);
			font-weight: 700;
		}
		#status-notice {
			display: none;
			margin-top: 16px;
			background: rgba(110, 26, 22, 0.9);
			border: 1px solid var(--red);
			color: #ffdcd6;
			padding: 12px 14px;
			font-size: 13px;
			line-height: 1.45;
			text-align: left;
		}
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>
	<noscript>
		Your browser does not support JavaScript.
	</noscript>
	<div id="status">
		<div class="loader-card">
			<div class="hazard-strip"></div>
			<div class="kicker">GAME OFF 2026 &bull; SHIFT GEARS &bull; SURVIVE</div>
			<h1 class="title">GEARBOX DUNGEON</h1>
			<p class="subtitle">First-Person Mechanical Roguelike Deckbuilder</p>
			<div class="rpm-header">
				<span id="status-label">IGNITING DRIVETRAIN...</span>
				<span id="status-pct">0%</span>
			</div>
			<div class="rpm-track">
				<div id="rpm-fill"></div>
			</div>
			<div id="status-notice"></div>
			<div class="controls-bar">
				<span><b>[Q / E]</b> SHIFT GEARS</span>
				<span><b>[DRAG / 1-9]</b> PLAY CARDS</span>
				<span><b>[X]</b> BURN +1K RPM</span>
				<span><b>[SPACE]</b> END TURN</span>
				<span><b>[F]</b> FULLSCREEN</span>
			</div>
		</div>
	</div>
	<script src="$GODOT_URL"></script>
	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusLabel = document.getElementById('status-label');
	const statusPct = document.getElementById('status-pct');
	const rpmFill = document.getElementById('rpm-fill');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		statusNotice.style.display = 'block';
	}

	function displayFailureNotice(err) {
		console.error(err);
		statusLabel.textContent = 'IGNITION FAULT';
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const ratio = Math.min(1, Math.max(0, current / total));
					const pct = Math.round(ratio * 100);
					rpmFill.style.width = Math.max(4, pct) + '%';
					statusPct.textContent = pct + '%';
					if (pct >= 98) {
						statusLabel.textContent = 'CALIBRATING COCKPIT...';
					} else if (pct >= 65) {
						statusLabel.textContent = 'PRESSURIZING HYDRAULICS...';
					} else {
						statusLabel.textContent = 'IGNITING DRIVETRAIN...';
					}
				}
			},
		}).then(() => {
			if (!initializing) {
				return;
			}
			initializing = false;
			rpmFill.style.width = '100%';
			statusPct.textContent = '100%';
			statusLabel.textContent = 'ENGINE ONLINE';
			statusOverlay.classList.add('fade-out');
			setTimeout(() => {
				statusOverlay.remove();
			}, 300);
		}, displayFailureNotice);
	}
}());
	</script>
</body>
</html>
