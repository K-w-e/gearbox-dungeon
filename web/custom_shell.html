<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		* { box-sizing: border-box; }
		html, body, #canvas {
			margin: 0;
			padding: 0;
			border: 0;
			width: 100%;
			height: 100%;
			background: #0b0d11;
			color: #f4f1e8;
			overflow: hidden;
			user-select: none;
			-webkit-user-select: none;
			touch-action: none;
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		}
		#canvas {
			display: block;
		}
		#canvas:focus {
			outline: none;
		}
		#status {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			background: #0b0d11;
			z-index: 10;
			transition: opacity 0.25s ease-out;
		}
		#status.fade-out {
			opacity: 0;
			pointer-events: none;
		}
		.loader {
			width: min(320px, 80vw);
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 18px;
		}
		.hgate-mark {
			width: 48px;
			height: 48px;
			display: block;
		}
		.brand {
			margin: 0;
			font-size: 18px;
			font-weight: 700;
			letter-spacing: 0.24em;
			text-transform: uppercase;
			color: #f4f1e8;
			text-align: center;
		}
		.brand span {
			color: #ffb830;
		}
		.bar-wrap {
			width: 100%;
			height: 3px;
			background: #1d222c;
			overflow: hidden;
		}
		#bar-fill {
			height: 100%;
			width: 0%;
			background: #ffb830;
			transition: width 0.12s linear;
		}
		#status-pct {
			font-size: 12px;
			letter-spacing: 0.16em;
			color: #8c95a6;
		}
		#status-notice {
			display: none;
			width: 100%;
			margin-top: 8px;
			padding: 10px 12px;
			border-left: 2px solid #ff472b;
			background: #171214;
			color: #f4c7c0;
			font-size: 12px;
			line-height: 1.45;
		}
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>
	<noscript>
		Your browser does not support JavaScript.
	</noscript>
	<div id="status">
		<div class="loader">
			<svg class="hgate-mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
				<rect x="2" y="2" width="60" height="60" rx="5" stroke="#ffb830" stroke-width="2.5"/>
				<path d="M16 18V46M32 18V46M48 18V46M16 32H48" stroke="#ffb830" stroke-width="2.5" stroke-linecap="square"/>
				<circle cx="32" cy="32" r="5" fill="#ffb830"/>
			</svg>
			<h1 class="brand">GEARBOX <span>DUNGEON</span></h1>
			<div class="bar-wrap">
				<div id="bar-fill"></div>
			</div>
			<div id="status-pct">LOADING 0%</div>
			<div id="status-notice"></div>
		</div>
	</div>
	<script src="$GODOT_URL"></script>
	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusPct = document.getElementById('status-pct');
	const barFill = document.getElementById('bar-fill');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		statusNotice.style.display = 'block';
	}

	function displayFailureNotice(err) {
		console.error(err);
		statusPct.textContent = 'LOAD ERROR';
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const ratio = Math.min(1, Math.max(0, current / total));
					const pct = Math.round(ratio * 100);
					barFill.style.width = pct + '%';
					statusPct.textContent = 'LOADING ' + pct + '%';
				}
			},
		}).then(() => {
			if (!initializing) {
				return;
			}
			initializing = false;
			barFill.style.width = '100%';
			statusPct.textContent = '100%';
			statusOverlay.classList.add('fade-out');
			setTimeout(() => {
				statusOverlay.remove();
			}, 260);
		}, displayFailureNotice);
	}
}());
	</script>
</body>
</html>
